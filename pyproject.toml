[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "palisade"
version = "0.1.0"
description = "Multi-cloud (AWS + Azure) security posture scanner with CIS-mapped rules, auto-remediation, and attack simulation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Primel Jayawardana" }]
dependencies = [
  "boto3>=1.34",
  "click>=8.1",
  "rich>=13.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "moto[s3,iam,ec2,cloudtrail,kms,sns]>=5.0",
  "pytest>=9.1.1",
  "ruff>=0.5",
]

[project.scripts]
palisade = "palisade.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
palisade = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
# The scanner matches on "0.0.0.0" strings; it never binds to them.
"src/palisade/rules/*" = ["S104"]
"src/palisade/cli.py" = ["S106"]
