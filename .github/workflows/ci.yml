name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]" checkov
      - run: ruff check src functions tests
      - run: ruff format --check src functions tests
      - run: pytest
      - name: Attack simulation
        run: palisade simulate --report simulation-report.md
      - name: Publish simulation summary
        if: matrix.python == '3.12'
        run: cat simulation-report.md >> "$GITHUB_STEP_SUMMARY"

  terraform:
    name: Terraform (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [aws, azure]
    defaults:
      run:
        working-directory: terraform/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  iac-scan:
    name: Checkov (policy as code)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          external_checks_dirs: policies/checkov
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov.sarif
          category: checkov-iac

  posture-demo:
    name: Posture scan to code scanning
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Scan the example Azure snapshot
        run: |
          palisade scan azure --snapshot examples/azure-snapshot.json --format sarif -o palisade.sarif
          palisade scan azure --snapshot examples/azure-snapshot.json --format markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: palisade.sarif
          category: palisade-azure-example
